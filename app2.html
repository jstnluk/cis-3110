<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project 2 - Customer Directory</title>

  <style>

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 40px;
    }

    h1 {
      color: #bb86fc;
      text-align: center;
    }

    .instruction {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
      margin-bottom: 30px;
      text-align: center;
    }

    #customer-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    .customer-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: 0.2s;
    }

    .customer-card:hover {
      border-color: #bb86fc;
    }

    .customer-card.selected {
      border: 2px solid #03dac6;
      background-color: #252525;
    }

    .customer-card h2 {
      margin: 0 0 10px 0;
      color: #03dac6;
      font-size: 1.4rem;
    }

    .customer-card h2 span {
      color: #888;
      font-size: 0.9rem;
    }

    .customer-card p {
      margin: 5px 0;
      color: #b0b0b0;
    }

    .membership-tier {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: #333;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <h1>Customer Directory</h1>

  <div class="instruction">
    <p>
      Customer data is dynamically rendered using JavaScript iteration.
      Click a customer card to select it.
    </p>
  </div>

  <div id="customer-container"></div>

  <script src="app2.js"></script>

</body>

</html>
